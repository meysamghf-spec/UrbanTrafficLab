services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: urbantrafficlab
      POSTGRES_PASSWORD: urbantrafficlab
      POSTGRES_DB: urbantrafficlab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbantrafficlab -d urbantrafficlab"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      UTL_DATABASE_URL: postgresql+psycopg://urbantrafficlab:urbantrafficlab@db:5432/urbantrafficlab
      UTL_CORS_ORIGINS: http://localhost:3000
      UTL_LLM_PROVIDER: none
      SUMO_HOME: /usr/share/sumo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
